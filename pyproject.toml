[project]
name = "sentinel"
version = "2.0.0"
description = "Sentinel v2 — 通用主题舆情雷达：collect / alert / analyze / advisor 四服务架构"
requires-python = ">=3.12"

dependencies = [
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "telethon>=1.36",
    "feedparser>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
